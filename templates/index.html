<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LendTrack – Customer Success Dashboard</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 20px; background:#f9f9f9;}
        h2 {color:#333;}
        table {border-collapse: collapse; width: 100%; margin-bottom: 30px;}
        th, td {border: 1px solid #ccc; padding: 8px; text-align: left;}
        th {background:#e2e2e2;}
        .chart-container {width: 100%; max-width: 800px; margin:auto;}
    </style>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>LendTrack Dashboard</h1>

    <section id="onboarding">
        <h2>Lender Onboarding Tracker</h2>
        <table id="lenders-table">
            <thead><tr><th>ID</th><th>Name</th><th>Onboarding Date</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>

    <section id="queries">
        <h2>Client Queries</h2>
        <table id="queries-table">
            <thead><tr><th>ID</th><th>Lender ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Owner</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>

    <section id="collections">
        <h2>Collections Analytics</h2>
        <div class="chart-container">
            <canvas id="collectionChart"></canvas>
        </div>
    </section>

    <script>
        async function loadLenders(){
            const res = await fetch('/api/lenders');
            const data = await res.json();
            const tbody = document.querySelector('#lenders-table tbody');
            data.forEach(r=>{
                const tr=document.createElement('tr');
                tr.innerHTML = `<td>${r.id}</td><td>${r.name}</td><td>${r.onboarding_date}</td><td>${r.onboarding_status}</td>`;
                tbody.appendChild(tr);
            });
        }
        async function loadQueries(){
            const res = await fetch('/api/queries');
            const data = await res.json();
            const tbody = document.querySelector('#queries-table tbody');
            data.forEach(r=>{
                const tr=document.createElement('tr');
                tr.innerHTML = `<td>${r.id}</td><td>${r.lender_id}</td><td>${r.title}</td><td>${r.priority}</td><td>${r.status}</td><td>${r.assigned_to}</td>`;
                tbody.appendChild(tr);
            });
        }
        async function loadCollections(){
            const res = await fetch('/api/collections');
            const data = await res.json();
            const labels = data.map(r=>r.lender_name);
            const totals = data.map(r=>r.total_loans);
            const collected = data.map(r=>r.collected_amount);
            const pending = data.map(r=>r.pending_amount);
            const ctx = document.getElementById('collectionChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {label: 'Total Loans', data: totals, backgroundColor: 'rgba(54,162,235,0.6)'},
                        {label: 'Collected', data: collected, backgroundColor: 'rgba(75,192,192,0.6)'},
                        {label: 'Pending', data: pending, backgroundColor: 'rgba(255,99,132,0.6)'}
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {legend: {position: 'top'}},
                    scales: {y: {beginAtZero:true}}
                }
            });
        }
        // Load all sections
        loadLenders();
        loadQueries();
        loadCollections();
    </script>
</body>
</html>
